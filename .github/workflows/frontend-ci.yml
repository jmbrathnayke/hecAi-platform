name: Frontend CI

# CI only (build + test). Gates feature work and both shared branches:
#   - development = testing/integration branch
#   - main        = production branch
# Deployment (CD: development -> testing env, main -> production env) is a separate,
# future workflow added when Render/Vercel/Azure targets + secrets are wired up.
on:
  push:
    branches:
      - "feature/**"
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The unit tests mock @tensorflow/tfjs wholesale, so NONE of them loads a real weight file.
      # That is exactly how a model.json that no browser could deserialize (Keras 3 layers format
      # vs tfjs-layers 4.22.0) shipped and stayed broken: the converter exits 0, the mock defines
      # whatever API the code calls, and every test passes. This step loads the real committed
      # model in a real Chromium and asserts it returns a valid probability vector.
      - name: Install Chromium for the model smoke check
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed TF.js model actually loads
        run: node scripts/tfjs-bench/verify-model.mjs --smoke
