name: Frontend CI

# CI only (build + test). Gates feature work and both shared branches:
#   - development = testing/integration branch
#   - main        = production branch
# Deployment (CD: development -> testing env, main -> production env) is a separate,
# future workflow added when Render/Vercel/Azure targets + secrets are wired up.
on:
  push:
    branches:
      - "feature/**"
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
