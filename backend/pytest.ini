[pytest]
# Marker registration only (Story 7.4). Deliberately no `testpaths` and no `addopts`: this is
# the project's first pytest config, and setting either would change how the pre-existing suite
# is collected — a side effect no story asked for.
#
# The scenario suite carries BOTH `@pytest.mark.scenario` and a module-level skipif on
# HEC_SCENARIO_DB_URL. The skipif is what keeps CI's bare `pytest -v` green with no database;
# the marker is what makes `-m "not scenario"` actually deselect the suite on a machine that
# does have one. An earlier version registered the marker but applied it to no test, so that
# escape hatch silently deselected nothing.
markers =
    scenario: end-to-end test requiring a real Postgres (set HEC_SCENARIO_DB_URL)
