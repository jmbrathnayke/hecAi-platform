[pytest]
# Marker registration only (Story 7.4). Deliberately no `testpaths` and no `addopts`: this is
# the project's first pytest config, and setting either would change how the pre-existing suite
# is collected — a side effect no story asked for.
#
# The scenario suite additionally skips itself at import when HEC_SCENARIO_DB_URL is unset, so
# CI's bare `pytest -v` stays green without needing `-m "not scenario"`. The marker exists so
# the suite can also be excluded explicitly when a database IS available.
markers =
    scenario: end-to-end test requiring a real Postgres (set HEC_SCENARIO_DB_URL)
